name: Check

on:
  push:
    branches: [main]
  pull_request:
    # 此仓库未配置必需状态检查，纯文档拉取请求可直接跳过。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Homebrew
        run: |
          brew update
          tap_parent="$(brew --repository)/Library/Taps/hiarieszhou"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-tap"
          brew trust --cask hiarieszhou/tap/howler
      - name: Style
        run: brew style --cask hiarieszhou/tap/howler
      - name: Audit
        run: brew audit --cask --online --strict hiarieszhou/tap/howler
      - name: Fetch and verify
        run: brew fetch --cask hiarieszhou/tap/howler
